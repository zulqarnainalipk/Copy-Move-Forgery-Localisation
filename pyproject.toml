[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forgery"
version = "0.1.0"
description = "Grouped, baseline-controlled copy-move forgery localisation in biomedical research images"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "Zulqarnain Ali", email = "zulqar445ali@gmail.com"}, {name = "Muhammad Ibrahim Qasmi"}]
requires-python = ">=3.9"
keywords = ["copy-move forgery", "image forensics", "biomedical images", "research integrity", "segmentation",
            "DINOv2", "keypoint matching", "SIFT"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "Pillow",
    "opencv-python",
    "imagehash",
    "tqdm",
]

[project.optional-dependencies]
test = ["pytest"]
tables = ["tabulate"]
superpoint = ["lightglue @ git+https://github.com/cvg/LightGlue.git"]

[project.urls]
Repository = "https://github.com/zulqarnainalipk/Copy-Move-Forgery-Localisation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = ["slow: end-to-end training test on synthetic data (deselect with -m \"not slow\")"]

[tool.ruff]
line-length = 120
